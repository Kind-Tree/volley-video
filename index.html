<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyse vidéo volley</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
  main { max-width: 960px; margin: auto; padding: 16px; }
  h1 { margin: 8px 0; font-size: 22px; }
  p { min-height: 48px; margin: 8px 0 16px; font-size: 18px; }
  #cadre { aspect-ratio: 16 / 9; background: #000; }
  button, select { margin: 12px 4px 0; padding: 10px 12px; font-size: 16px; cursor: pointer; }
  select { max-width: 100%; }
  label { display: inline-block; margin: 12px 8px 0; }
  [hidden] { display: none !important; }
  #zoneYoutube, #video { width: 100%; height: 100%; }
  #video { display: block; background: #000; }
  #infoFichier { margin: 12px 0 0; font-size: 14px; color: #bbb; }
</style>
</head>
<body>
<main>
  <h1 id="titre">Chargement…</h1>
  <p id="consigne"></p>
  <div id="cadre">
    <div id="zoneYoutube"><div id="lecteur"></div></div>
    <video id="video" controls playsinline preload="auto" hidden></video>
  </div>

  <button id="precedent">⏮ Précédent</button>
  <button id="lancer">▶ Lancer / Rejouer</button>
  <button id="suivant">Suivant ⏭</button>
  <br>
  <select id="liste" aria-label="Aller à une action"></select>
  <label>Vitesse
    <select id="vitesse">
      <option value="0.25">x0,25</option>
      <option value="0.5">x0,5</option>
      <option value="1" selected>x1</option>
    </select>
  </label>
  <label><input type="checkbox" id="auto" checked> Enchaîner automatiquement</label>
  <br>
  <button id="choisirMp4">📁 Choisir un fichier MP4</button>
  <button id="retourYoutube" hidden>↩ Revenir à YouTube</button>
  <input type="file" id="fichier" accept="video/mp4,.mp4,.m4v" hidden>
  <div id="infoFichier" hidden></div>
</main>

<script>
  // ===== RÉGLAGES =====
  const VIDEO = "YRw4B4BIxxI";
  const AVANT = 3;  // secondes affichées avant chaque timecode
  const APRES = 10; // secondes affichées après chaque timecode
  const AFFICHER_NOTES = true; // false = masque les notes à l'écran

  // ===== ACTIONS =====
  // Ajoute fin: "mm:ss" à une action pour choisir précisément sa fin.
  const ACTIONS = [
    { set: 1, temps: "0:01", note: "Julien trop proche du poste 6, garder la diag" },
    { set: 1, temps: "0:50", note: "Absence au block, décision douteuse de l'arbitre" },
    { set: 1, temps: "1:55", note: "Analyse de trajectoire trop tardive → pas bien placé au block" },
    { set: 1, temps: "2:20", note: "Arthur spectateur ⚠ aucune excuse, manque d'engagement" },
    { set: 1, temps: "3:10", note: "Sautent haut, Gonzague, si tu t'imposes jamais, on doit relancer en 3e contact, communication" },
    { set: 1, temps: "3:30", note: "Être prêt plus vite, lire le bras du serveur, pas une surprise, il avait déjà servi avant fond de terrain" },
    { set: 1, temps: "3:40", note: "Ace dans l'intervalle, priorité (?) gauche de main (?), ballon arrive vite et slicé, Arthur tu dois au moins essayer, adaptabilité" },
    { set: 1, temps: "4:40", note: "Franchissement block, version (?)" },
    { set: 1, temps: "4:55", note: "Choix de passe → poste 4, blockeur en face" },
    { set: 1, temps: "6:30", note: "Sacha flotte, sans block on défend, faut être… (?)" },
    { set: 1, temps: "6:55", note: "Arthur → intervalle, 3 aces + 1 réception chez eux = 4 points" },
    { set: 1, temps: "8:15", note: "Jean amorce diag mais doit mettre les mains sur le ballon" },
    { set: 1, temps: "8:30", note: "Franchissement au block" },

    { set: 2, temps: "9:15", note: "Ace → Julien" },
    { set: 2, temps: "10:30", note: "Pierre → doit la mettre au sol → (?)" },
    { set: 2, temps: "12:15", note: "Inter gauche, Julien tu coupes dans le service pour aider Pierre, pourquoi ça marche pas avec Arthur ?" },
    { set: 2, temps: "13:20", note: "Julien adaptabilité, vers derrière le block" },
    { set: 2, temps: "15:18", note: "Gonzague a une réception derrière le spot (?), choix simple = Hugo en forme à ce moment-là" },
    { set: 2, temps: "16:15", note: "Gonzague doit sauver haut contre-terrain pour relais Jean poste 6" },
    { set: 2, temps: "17:00", fin: "17:30", note: "Placement Julien, peu de trou dans le block, ensuite Taha (?) fort (?) au service → série de 6 fautes directes" },
    { set: 2, temps: "19:35", note: "Relance Flo" },
    { set: 2, temps: "19:50", note: "Réception, retour direct Julien" },

    { set: 3, temps: "22:40", note: "2 fautes de service d'affilée, attention à la dynamique" },
    { set: 3, temps: "23:15", note: "Pierre attend le ballon déjà en manchette → avance 1 pas + 10 doigts" },
    { set: 3, temps: "24:25", note: "Gonzague sur la bidouille (?) ⚠" },
    { set: 3, temps: "25:18", note: "Sacha ne se force pas = gêne Arthur et ne peut pas enchaîner fixe sur bonne réception" },
    { set: 3, temps: "28:20", note: "Hugo derrière le block" },
    { set: 3, temps: "28:35", note: "Comment Flo peut s'arracher pour ne rien essayer derrière, encore une fois. Julien → Arthur" },
    { set: 3, temps: "30:30", note: "10 cm de toi Julien → intervalle Arthur et toi → tu es libero ⚠" },
    { set: 3, temps: "31:40", note: "Hugo → main extérieure donnée à l'adversaire" }
  ];

  // ===== FONCTIONNEMENT =====
  // Deux sources possibles pour les mêmes ACTIONS :
  //  - "youtube" : la vidéo VIDEO, lue avec l'API YouTube (mode par défaut) ;
  //  - "mp4"     : un fichier choisi sur l'ordinateur, lu sur place sans être envoyé en ligne.
  const MESSAGE_YOUTUBE_INDISPONIBLE = "YouTube est indisponible. Choisis un fichier MP4 pour continuer.";
  const MESSAGE_MP4_ILLISIBLE = "Ce fichier n'est pas lisible dans ce navigateur. Essaie un MP4 encodé en H.264/AAC.";
  const DELAI_YOUTUBE = 15000;    // ms d'attente maximale de l'API YouTube
  const PAUSE_AVANT_SUITE = 2000; // ms d'affichage du message quand une action est hors du fichier

  let mode = "youtube";
  let index = 0;

  // État du mode YouTube
  let lecteur;
  let etatYoutube = "chargement"; // "chargement", "pret" ou "indisponible"
  let enLecture = false; // évite de sauter une action si YouTube signale deux fois la fin

  // État du mode MP4
  const video = document.getElementById("video");
  let urlLocale = null;         // adresse temporaire du fichier (URL.createObjectURL)
  let metadonneesPretes = false; // durée connue, positionnement possible
  let fichierIllisible = false;
  let lectureDemandee = false;  // « Lancer » cliqué avant que le fichier soit prêt
  let extraitActif = false;     // vrai entre le début et la fin d'un extrait
  let finExtrait = 0;           // en secondes
  let jeton = 0;                // change à chaque extrait : invalide les minuteurs précédents
  let surveillance = null;      // identifiant requestAnimationFrame
  let minuteurSuite = null;

  const element = (id) => document.getElementById(id);

  const secondes = (temps) =>
    temps.split(":").reduce((total, valeur) => total * 60 + Number(valeur), 0);

  const minutes = (total) => {
    const s = Math.floor(total);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };

  const vitesse = () => Number(element("vitesse").value);

  // Bornes d'un extrait, communes aux deux modes.
  const bornes = (action) => ({
    debut: Math.max(secondes(action.temps) - AVANT, 0),
    fin: action.fin ? secondes(action.fin) : secondes(action.temps) + APRES
  });

  const parametres = (action) => {
    const { debut, fin } = bornes(action);
    return { videoId: VIDEO, startSeconds: debut, endSeconds: fin };
  };

  ACTIONS.forEach((action, position) => {
    const option = document.createElement("option");
    option.value = position;
    option.textContent = `${position + 1}. Set ${action.set} – ${action.temps}`;
    element("liste").appendChild(option);
  });

  function afficher() {
    const action = ACTIONS[index];
    element("titre").textContent =
      `Action ${index + 1}/${ACTIONS.length} – Set ${action.set} – ${action.temps}`;
    element("consigne").textContent = AFFICHER_NOTES ? action.note : "";
    element("liste").value = index;
  }

  function jouer(position) {
    index = position;
    afficher();
    annulerSuite();
    if (mode === "mp4") {
      jouerMp4();
    } else {
      jouerYoutube();
    }
  }

  function suivante() {
    if (index < ACTIONS.length - 1) {
      jouer(index + 1);
    } else {
      element("titre").textContent = "Fin de la séquence";
      element("consigne").textContent = "";
    }
  }

  // ----- Mode YouTube -----
  function messageErreur(code) {
    if (code === 101 || code === 150) {
      return "YouTube n'autorise pas la lecture de cette vidéo dans une page externe.";
    }
    if (code === 153) {
      return "Erreur 153 : ouvre la page depuis son adresse https et désactive les extensions de confidentialité.";
    }
    return `La vidéo ne peut pas être lue (erreur ${code}).`;
  }

  function signalerYoutubeIndisponible() {
    if (etatYoutube === "pret") return;
    etatYoutube = "indisponible";
    if (mode === "youtube") element("consigne").textContent = MESSAGE_YOUTUBE_INDISPONIBLE;
  }

  function jouerYoutube() {
    if (etatYoutube !== "pret") {
      element("consigne").textContent = etatYoutube === "indisponible"
        ? MESSAGE_YOUTUBE_INDISPONIBLE
        : "YouTube est en cours de chargement…";
      return;
    }
    enLecture = false;
    lecteur.loadVideoById(parametres(ACTIONS[index]));
  }

  // Recharge l'action en cours dans YouTube sans lancer la lecture.
  function preparerYoutube() {
    if (etatYoutube === "pret") {
      enLecture = false;
      lecteur.cueVideoById(parametres(ACTIONS[index]));
    } else if (etatYoutube === "indisponible") {
      element("consigne").textContent = MESSAGE_YOUTUBE_INDISPONIBLE;
    }
  }

  function onYouTubeIframeAPIReady() {
    lecteur = new YT.Player("lecteur", {
      width: "100%",
      height: "100%",
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          etatYoutube = "pret";
          if (mode === "youtube") {
            afficher();
            lecteur.cueVideoById(parametres(ACTIONS[index]));
          }
        },
        onStateChange: (evenement) => {
          if (mode !== "youtube") return;
          if (evenement.data === YT.PlayerState.PLAYING) {
            enLecture = true;
            lecteur.setPlaybackRate(Number(element("vitesse").value));
          }
          if (evenement.data === YT.PlayerState.ENDED && enLecture) {
            enLecture = false;
            if (element("auto").checked) suivante();
          }
        },
        onError: (evenement) => {
          if (mode === "youtube") element("consigne").textContent = messageErreur(evenement.data);
        }
      }
    });
  }

  // ----- Mode MP4 local -----
  function annulerSuite() {
    clearTimeout(minuteurSuite);
    minuteurSuite = null;
  }

  function arreterSurveillance() {
    if (surveillance !== null) cancelAnimationFrame(surveillance);
    surveillance = null;
  }

  // Surveille le temps image par image tant que l'extrait est en lecture.
  function demarrerSurveillance() {
    if (!extraitActif || surveillance !== null) return;
    const boucle = () => {
      surveillance = null;
      verifierFin();
      if (extraitActif && !video.paused) surveillance = requestAnimationFrame(boucle);
    };
    surveillance = requestAnimationFrame(boucle);
  }

  function verifierFin() {
    if (extraitActif && video.currentTime >= finExtrait) terminerExtrait();
  }

  function terminerExtrait() {
    if (!extraitActif) return; // déjà terminé : jamais de double déclenchement
    extraitActif = false;
    arreterSurveillance();
    video.pause();
    if (element("auto").checked) suivante();
  }

  // Place la vidéo au début de l'action en cours et fixe sa fin, sans lancer la lecture.
  // Renvoie false si l'action commence après la fin du fichier.
  function armerMp4() {
    const action = ACTIONS[index];
    const { debut, fin } = bornes(action);
    const duree = video.duration;
    const dureeConnue = Number.isFinite(duree);
    if (dureeConnue && debut >= duree) {
      element("consigne").textContent =
        `L'action ${index + 1} (${action.temps}) commence après la fin du fichier (${minutes(duree)}).`;
      return false;
    }
    finExtrait = dureeConnue ? Math.min(fin, duree) : fin;
    video.currentTime = debut;
    video.playbackRate = vitesse();
    extraitActif = true;
    return true;
  }

  function jouerMp4() {
    const monJeton = ++jeton;
    extraitActif = false;
    arreterSurveillance();
    video.pause();
    if (fichierIllisible) {
      element("consigne").textContent = MESSAGE_MP4_ILLISIBLE;
      return;
    }
    if (!metadonneesPretes) {
      lectureDemandee = true; // la lecture partira dès que le fichier sera prêt
      return;
    }
    if (!armerMp4()) {
      if (element("auto").checked) {
        minuteurSuite = setTimeout(() => {
          if (monJeton === jeton) suivante();
        }, PAUSE_AVANT_SUITE);
      }
      return;
    }
    video.play().catch(() => {});
  }

  // Arrête le fichier en cours et libère son adresse temporaire.
  function arreterMp4() {
    jeton++;
    extraitActif = false;
    lectureDemandee = false;
    metadonneesPretes = false;
    fichierIllisible = false;
    arreterSurveillance();
    annulerSuite();
    video.pause();
    video.removeAttribute("src");
    video.load();
    if (urlLocale) {
      URL.revokeObjectURL(urlLocale);
      urlLocale = null;
    }
  }

  function basculerAffichage() {
    const mp4 = mode === "mp4";
    element("zoneYoutube").hidden = mp4;
    video.hidden = !mp4;
    element("retourYoutube").hidden = !mp4;
    element("infoFichier").hidden = !mp4;
  }

  function choisirFichier(fichier) {
    if (!fichier) return;
    arreterMp4();
    if (etatYoutube === "pret") {
      try { lecteur.pauseVideo(); } catch (erreur) {}
    }
    enLecture = false;
    mode = "mp4";
    basculerAffichage();
    element("infoFichier").textContent =
      `${fichier.name} — Lecture locale : la vidéo reste sur cet ordinateur`;
    afficher();
    urlLocale = URL.createObjectURL(fichier);
    video.src = urlLocale;
  }

  function revenirYoutube() {
    arreterMp4();
    mode = "youtube";
    basculerAffichage();
    afficher();
    preparerYoutube();
  }

  video.addEventListener("loadedmetadata", () => {
    if (!urlLocale) return;
    metadonneesPretes = true;
    if (video.videoWidth === 0) {
      fichierIllisible = true; // son seul ou image non décodable
      element("consigne").textContent = MESSAGE_MP4_ILLISIBLE;
      return;
    }
    if (lectureDemandee) {
      lectureDemandee = false;
      jouerMp4();
    } else {
      armerMp4();
    }
  });
  video.addEventListener("error", () => {
    if (!urlLocale || !video.error) return; // erreur liée à l'arrêt volontaire d'un fichier
    fichierIllisible = true;
    lectureDemandee = false;
    extraitActif = false;
    arreterSurveillance();
    annulerSuite();
    element("consigne").textContent = MESSAGE_MP4_ILLISIBLE;
  });
  video.addEventListener("play", demarrerSurveillance);
  video.addEventListener("pause", arreterSurveillance);
  video.addEventListener("timeupdate", verifierFin); // secours si l'onglet est en arrière-plan
  video.addEventListener("ended", () => {
    if (extraitActif) terminerExtrait();
  });

  // ----- Commandes communes -----
  element("lancer").onclick = () => jouer(index);
  element("precedent").onclick = () => jouer(Math.max(index - 1, 0));
  element("suivant").onclick = () => jouer(Math.min(index + 1, ACTIONS.length - 1));
  element("liste").onchange = (evenement) => jouer(Number(evenement.target.value));
  element("vitesse").onchange = (evenement) => {
    const choix = Number(evenement.target.value);
    if (mode === "mp4") {
      video.playbackRate = choix;
    } else if (etatYoutube === "pret") {
      lecteur.setPlaybackRate(choix);
    }
  };
  element("choisirMp4").onclick = () => element("fichier").click();
  element("fichier").onchange = (evenement) => {
    const fichier = evenement.target.files[0];
    evenement.target.value = ""; // permet de rechoisir le même fichier
    choisirFichier(fichier);
  };
  element("retourYoutube").onclick = revenirYoutube;

  // Première action affichée tout de suite, sans attendre YouTube.
  afficher();

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  script.onerror = signalerYoutubeIndisponible;
  document.head.appendChild(script);
  setTimeout(signalerYoutubeIndisponible, DELAI_YOUTUBE);
</script>
</body>
</html>
